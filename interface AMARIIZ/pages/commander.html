<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commander | AMARIIZ MILK</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a class="brand navbar-brand" href="../index.html"><img src="../assets/images/logo.svg" alt=""><span>AMARIIZ <em>MILK</em></span></a><a class="text-action" href="../index.html">Accueil</a></div></nav><header class="page-hero"><div class="container"><div class="eyebrow">COMMANDE CLIENT</div><h1>Préparez votre<br><i>commande.</i></h1><p>Le montant et le lien WhatsApp sont générés par le serveur.</p></div></header><main class="section-space"><div class="container"><div class="row g-4"><div class="col-lg-7"><form class="panel" id="orderForm"><h4 class="mb-4">Détails de la commande</h4><div class="row g-3"><div class="col-md-6"><label class="form-label">Nom du client</label><input class="form-control" name="customer_name" required></div><div class="col-md-6"><label class="form-label">Téléphone</label><input class="form-control" name="phone" type="tel" required placeholder="+243..."></div><div class="col-md-6"><label class="form-label">Produit</label><select class="form-select" id="variant" required></select></div><div class="col-md-6"><label class="form-label">Quantité</label><input class="form-control" id="quantity" type="number" min="1" value="1" required></div><div class="col-md-6"><label class="form-label">Ville</label><select class="form-select" name="city_id" id="city" required></select></div><div class="col-md-6"><label class="form-label">Réception</label><select class="form-select" name="reception_mode"><option value="livraison">Livraison</option><option value="retrait">Retrait</option></select></div><div class="col-md-6"><label class="form-label">Paiement</label><select class="form-select" name="payment_method"><option value="cash">Espèces</option><option value="mobile_money">Mobile Money</option><option value="virement">Virement bancaire</option></select></div><div class="col-12"><label class="form-label">Adresse</label><textarea class="form-control" rows="3" name="address" required></textarea></div></div><button class="btn btn-brand mt-4" type="submit">Valider et ouvrir WhatsApp <i class="bi bi-whatsapp"></i></button><p class="form-feedback small text-danger mt-3"></p></form></div></div></div></main><script src="../assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const form=document.getElementById('orderForm'),variant=document.getElementById('variant'),city=document.getElementById('city'),out=form.querySelector('.form-feedback');try{const [products,cities]=await Promise.all([loadProducts(),api('/cities')]);variant.innerHTML=products.map(p=>'<option value="'+p.id+'">'+p.name+' — '+p.flavour+' — '+p.size+' ('+fc(p.price)+')</option>').join('');city.innerHTML=cities.map(c=>'<option value="'+c.id+'">'+c.name+' — livraison '+fc(c.delivery_fee)+'</option>').join('')}catch(e){out.textContent=e.message}form.addEventListener('submit',async e=>{e.preventDefault();try{await addToCart(variant.value,document.getElementById('quantity').value);const data=Object.fromEntries(new FormData(form));data.city_id=Number(data.city_id);const result=await api('/orders',{method:'POST',body:JSON.stringify(data)});out.textContent='Commande créée. Ouverture de WhatsApp…';window.open(result.whatsapp_url,'_blank')}catch(err){out.textContent=err.message}})})</script></body></html>
